# Failure messages for the session protocol. See specs/001-ultimate-feature-parity/contracts/session-protocol.md
# Every message states the cause and one next action, as FR-010 requires.
session.failure.version.mismatch=The client and the host share no protocol version. The client supports {0}. The host supports {1}. Update the client.
session.failure.product.mismatch=The client build {0} cannot work with the host build {1}. Use a client of the same release.
session.failure.auth.rejected=The session credential is not valid, or the owner revoked it. Connect again to get a new credential.
session.failure.project.not.found=The host has no project at {0}. Check the path on the host.
session.failure.project.locked=Another session has the project at {0}. Close that session, or open a different project.
session.failure.backend.not.ready=The host is still starting. Wait, then connect again.
session.failure.session.expired=The session ended, because the connection stayed down longer than {0}. Unsaved work is in the recovery record.
session.failure.trust.required=This operation needs your trust for the project at {0}. Grant trust, then try again.
session.failure.insecure.transport=The connection to the host is not encrypted, and the host is not the local machine. Use a tunnel or TLS, then connect again.
